server:
  port: 8090

spring:
  application:
    name: jnf-harness
  datasource:
    # D4：默认 H2 文件库（standalone）；MySQL 用环境变量覆盖 url/账号（R9：此处无任何密钥）
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/jnf-harness;MODE=MySQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  sql:
    init:
      mode: always
      # 种子脚本含中文：必须显式 UTF-8（默认跟平台 GBK 会把 display_name 插成乱码）
      encoding: UTF-8

mybatis:
  configuration:
    map-underscore-to-camel-case: true

harness:
  auth:
    api-keys: ${HARNESS_API_KEYS:}
  llm:
    default:
      base-url: ${LLM_BASE_URL:http://127.0.0.1:8777/v1}
      api-key: ${LLM_API_KEY:}
      model: ${LLM_MODEL:default-model}

logging:
  level:
    root: INFO
    com.jnf.harness: DEBUG
